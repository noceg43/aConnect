name: aConnect👥
entities:
  QuestionSet:
    properties:
      - {
          name: name,
          type: string,
          validation: { required: true }
        }
    belongsToMany:
      - {
          entity: Question,
          eager: true
        }
      
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin


  Question:
    properties:
      - {
          name: question,
          type: string,
          validation: { required: true}
        }
    belongsToMany:
      - {
          entity: Answer,
          eager: true
        }
      - {
          entity: MemberAnswer,
          eager: false
        }
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin


  Answer:
    properties:
      - {
          name: answer,
          type: string,
          validation: { required: true }
        }
      - {
          name: weight,
          type: number,
          validation: { required: true, min: -1, max: 1 }
        }
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin


  Member:
    properties:
      - {
        name: userId,
        type: number,
        validation: { required: true }
        }
      - {
          name: name,
          type: string,
          validation: { required: true }
        }
      - {
          name: socialContact,
          type: string,
          validation: { required: false }
        }
    belongsToMany:
      - {
          entity: Lobby
        }
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin


  MemberAnswer:
    belongsTo:
      - {
          entity: Member,
          eager: true
        }
      - {
        entity: Question,
        eager: true
        }
      - {
        entity: Answer,
        eager: true
        }
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin


  Match:
    belongsToMany:
      - Member
    belongsTo:
      - Lobby
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin

  
  Lobby:
    mainProp: name
    properties:
      - {
          name: name,
          type: string,
          validation: { required: true }
        }
      - {
          name: location,
          type: location,
          validation: { required: true }
        }
      - { 
          name: matchType, 
          type: choice, 
          options: { values: [romantic, friendly] },
          validation: { required: true }
        }
      - { 
          name: eventType,
          type: choice, 
          options: { values: [couple, group] },
          validation: { required: true }
        }
      - {
          name: maxMembers,
          type: number,
          validation: { required: true, min: 2 }
        }
      - {
          name: description,
          type: text
        }
      - {
          name: creationDate,
          type: timestamp,
          validation: { required: true }
        }
      - {
          name: preEventDate,
          type: timestamp,
          validation: { required: true }
        }
      - {
          name: eventDate,
          type: timestamp,
          validation: { required: true }
        }
      - {
          name: postEventDate,
          type: timestamp,
          validation: { required: true }
        }
      - {
          name: inviteLink,
          type: link,
          validation: { required: true }
        }
    belongsTo:
      - {
        entity: QuestionSet,
        eager: true
        }
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin


  Feedback:
    properties:
      - {
        name: rating,
        type: number,
        validation: { required: true, min: 1, max: 5 }
        }
    belongsTo:
      - {
        entity: Lobby,
        eager: true
        }
      - {
        entity: Member,
        eager: true
        }
    belongsToMany:
      - {
        entity: Member,
        eager: true
        }
    policies:
      read:
        - access: admin
      create:
        - access: admin
      update:
        - access: admin
      delete:
        - access: admin
